name: "🗃️ Legacy: SPI Configuration (parameter-only)"
description: Legacy parameter-only form. Prefer intent-driven templates (Spec / Verification / Debug) for flexibility.
title: "Legacy SPI Config (parameters only): [Brief description]"
labels: ["spi-customization", "enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Legacy SPI Configuration (parameter-only)

        This legacy form is **parameter-only** and is less flexible than the intent-driven workflows.

        Prefer these templates for most work:
        - **SPI Spec (intent-driven)**: captures behavior + acceptance criteria
        - **SPI Verification / Compliance**: captures what must be proven
        - **SPI Debug / Triage**: captures symptoms + evidence

        Please provide the following details for your custom SPI configuration:
  - type: input
    id: spi-mode
    attributes:
      label: SPI Mode
      description: Enter SPI mode (0, 1, 2, or 3)
      placeholder: "0, 1, 2, or 3"
    validations:
      required: true
  - type: input
    id: data-width
    attributes:
      label: Data Width
      description: Number of bits (8, 16, 32, or custom)
      placeholder: "8, 16, 32, or custom number"
    validations:
      required: true
  - type: input
    id: num-slaves
    attributes:
      label: Number of Slaves
      description: Number of slave devices (1, 2, 4, 8, or custom)
      placeholder: "1, 2, 4, 8, or custom"
    validations:
      required: true
  - type: dropdown
    id: slave-select
    attributes:
      label: Slave Select Behavior
      description: Select the slave select polarity
      options:
        - Active Low (most common)
        - Active High
    validations:
      required: true
  - type: dropdown
    id: data-order
    attributes:
      label: Data Order
      description: Select the data transmission order
      options:
        - MSB First (most common)
        - LSB First
    validations:
      required: true
  - type: checkboxes
    id: special-features
    attributes:
      label: Special Features
      description: Select any additional features needed
      options:
        - label: Interrupt Support
        - label: FIFO Buffers
        - label: DMA Support
        - label: Multi-master Support
  - type: dropdown
    id: test-duration
    attributes:
      label: Testing Requirements
      description: Select the level of testing required
      options:
        - Brief
        - Standard
        - Comprehensive
    validations:
      required: true
  - type: checkboxes
    id: testing-options
    attributes:
      label: Testing Options
      description: Select additional testing options
      options:
        - label: Clock Jitter Testing (tests timing margins)
        - label: Waveform Capture (generates detailed timing diagrams)
  - type: dropdown
    id: spi-role
    attributes:
      label: SPI Role
      description: Select the SPI operating mode
      options:
        - Master (default)
        - Slave
        - Dual (both master and slave)
    validations:
      required: true
  - type: checkboxes
    id: default-data
    attributes:
      label: Default Data Storage
      description: Enable default data patterns for testing
      options:
        - label: Enable Default Data Patterns
  - type: dropdown
    id: data-pattern
    attributes:
      label: Default Data Pattern
      description: Select the default data pattern to use
      options:
        - A5A5 (alternating pattern)
        - FFFF (all ones)
        - 0000 (all zeros)
        - 5555 (walking pattern)
        - Custom (user specified)
    validations:
      required: false
  - type: input
    id: custom-data
    attributes:
      label: Custom Data Value (Hex)
      description: Custom hexadecimal data value (e.g., A5A5)
      placeholder: "A5A5"
    validations:
      required: false
  - type: input
    id: clock-divider
    attributes:
      label: Clock Divider
      description: System clock divider for SPI clock (1-1024)
      placeholder: "2"
    validations:
      required: false
  - type: input
    id: fifo-depth
    attributes:
      label: FIFO Depth
      description: FIFO buffer depth (2-1024)
      placeholder: "16"
    validations:
      required: false
  - type: input
    id: max-slaves
    attributes:
      label: Maximum Slaves
      description: Maximum number of slaves supported (1-32)
      placeholder: "8"
    validations:
      required: false
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Any additional requirements, constraints, or specific use cases
      placeholder: "Provide any additional requirements, constraints, or specific use cases for this SPI configuration"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## What Happens Next?

        1. The agent will interpret the parameters
        2. RTL + testbench will be generated (or templates updated if needed)
        3. Simulation + evidence-based analysis will be produced under `results/issue-<n>/`
        4. The agent will report results and artifacts back in the issue

        **Expected completion time: 5-10 minutes**
