name: SPI Customizer (Agent-driven)

on:
  workflow_dispatch:

jobs:
  agent-assisted-packaging:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Agent-driven workflow notice
      run: |
        echo "This repository is pure agent-driven."
        echo ""
        echo "- GitHub Issues encode intent."
        echo "- Copilot (as an agent) performs generation, verification, and debugging."
        echo "- We do not auto-execute scripts on issue events."
        echo ""
        echo "If you want CI assistance, extend this workflow to package/upload artifacts"
        echo "that the agent already produced under results/issue-<n>/."
