name: SPI Customizer Automation

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

jobs:
  spi-customization:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Icarus Verilog and Cocotb
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog
        pip install cocotb pytest matplotlib

    - name: Install GTKWave for waveform generation
      run: |
        sudo apt-get install -y gtkwave

    - name: Process SPI Issue
      if: github.event.issue.number != null
      run: |
        python3 scripts/process_issue.py ${{ github.event.issue.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    - name: Send Email Results
      if: github.event.issue.number != null
      run: |
        python3 scripts/email_sender.py
      env:
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      continue-on-error: true  # Don't fail if email fails

    - name: Upload Results
      uses: actions/upload-artifact@v4
      if: github.event.issue.number != null
      with:
        name: spi-results-${{ github.event.issue.number }}
        path: |
          results/issue-${{ github.event.issue.number }}/
          plots/

    - name: Commit and Push Results
      if: success() && github.event.issue.number != null
      run: |
        # Debug: List all files in results directory
        echo "📁 Files in results/issue-${{ github.event.issue.number }}/:"
        ls -la results/issue-${{ github.event.issue.number }}/ || echo "Directory not found"

        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Check if results directory exists
        if [ -d "results/issue-${{ github.event.issue.number }}" ]; then
          echo "📁 Found results for issue #${{ github.event.issue.number }}"

          # List all files before adding
          echo "📋 Files before git add:"
          find results/issue-${{ github.event.issue.number }}/ -type f | head -20 || echo "No files found"
          echo "... (showing first 20 files)"

          # Verify expected files exist
          echo "🔍 Checking for expected files:"
          ls -la results/issue-${{ github.event.issue.number }}/spi_*.v 2>/dev/null || echo "No .v files found"
          ls -la results/issue-${{ github.event.issue.number }}/spi_*.py 2>/dev/null || echo "No .py files found"
          ls -la results/issue-${{ github.event.issue.number }}/spi_*.vcd 2>/dev/null || echo "No .vcd files found"

          # Add all files in the results directory recursively
          echo "📝 Adding all files in results/issue-${{ github.event.issue.number }}/"
          # Simple approach: list all files and add them individually
          for file in results/issue-${{ github.event.issue.number }}/*; do
            if [ -f "$file" ]; then
              echo "Adding: $file"
              git add "$file" || echo "Failed to add: $file"
            fi
          done

          # Also try adding plots directory if it exists
          if [ -d "plots" ]; then
            echo "📝 Adding plots/"
            git add plots/** || git add -A plots/ || echo "⚠️  No plot files to add"
          fi

          # Check what files are staged
          echo "📋 Staged files:"
          git diff --cached --name-only | head -20
          echo "... (showing first 20 staged files)"

          # Count staged files
          staged_count=$(git diff --cached --name-only | wc -l)
          echo "📊 Total staged files: $staged_count"

          # List all staged files with details
          echo "📋 Detailed staged files:"
          git diff --cached --name-status

          # Check if there are any changes to commit
          if ! git diff --staged --quiet; then
            echo "📝 Committing results..."
            git commit -m "🤖 Auto-generated results for issue #${{ github.event.issue.number }}

            - Generated custom SPI core
            - Created testbench files
            - Added simulation results
            - Included timing diagrams

            Triggered by: ${{ github.event.issue.title }}"

            # Push changes
            if git push origin main; then
              echo "✅ Results committed and pushed successfully!"
            elif git push origin master; then
              echo "✅ Results committed and pushed to master successfully!"
            else
              echo "⚠️  Push failed - may not have permissions"
              echo "📋 Commit created locally but not pushed"
            fi
          else
            echo "ℹ️  No changes to commit"
          fi
        else
          echo "⚠️  No results folder found for issue #${{ github.event.issue.number }}"
        fi
