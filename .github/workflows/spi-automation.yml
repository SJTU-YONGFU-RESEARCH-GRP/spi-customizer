name: SPI Customizer (Agent-driven)

on:
  workflow_dispatch:

jobs:
  agent-driven-notice:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Agent-driven workflow notice
      run: |
        echo "This repository is pure agent-driven."
        echo ""
        echo "- GitHub Issues encode intent (use templates 5 / 6 / 7 for spec, verify, debug)."
        echo "- Copilot (as a coding agent) reads the issue and the per-template instruction"
        echo "  files under .github/instructions/ then performs generation, verification,"
        echo "  and debugging directly — no scripts are auto-executed by CI."
        echo ""
        echo "Artifact packaging: if you want to bundle artifacts already produced under"
        echo "results/issue-<n>/ extend this workflow with an upload-artifact step."
